name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and semantic tests
        run: python -m pytest tests/ -q
      - name: Results regenerate unchanged from the evidence
        run: python src/make_results.py && git diff --exit-code RESULTS.md results/results.md
      - name: Compile all study code
        run: python -m compileall -q src scripts data/gen
      - name: No em dash in prose
        run: |
          if grep -rn $'\u2014' --include='*.md' . ; then
            echo "em dash found in markdown" && exit 1
          fi
